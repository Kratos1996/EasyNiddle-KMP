[versions]
kotlin = "2.3.20"
agp = "9.0.0"
# Compose 1.10.3 is the last stable line before iosX64 support was removed.
compose-multiplatform = "1.10.3"
# Keep Navigation 3 aligned with the Compose 1.10.3 multiplatform release.
navigation3-kmp = "1.0.0-alpha06"
kotlinx-serialization = "1.10.0"

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
navigation3-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "navigation3-kmp" }
