name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: write

jobs:
  wrapper-bootstrap:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.0"
      - name: Generate and commit Gradle Wrapper when missing
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 9.3.0 --distribution-type bin
          fi
          if ! git diff --quiet -- gradlew gradlew.bat gradle/wrapper; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add gradlew gradlew.bat gradle/wrapper/
            git commit -m "build: add Gradle 9.3.0 wrapper [skip ci]"
            git push
          fi

  abi-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.0"
      - name: Check or initialize Kotlin ABI baseline
        run: |
          if [ -f easyniddle/api/easyniddle.klib.api ]; then
            gradle :easyniddle:checkKotlinAbi
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            gradle :easyniddle:updateKotlinAbi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add easyniddle/api/
            git commit -m "chore: add Kotlin ABI baseline [skip ci]"
            git push
          else
            echo "Kotlin ABI baseline is missing; refusing to generate it from a pull request."
            exit 1
          fi

  desktop-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.0"
      - name: Compile sample app and run common tests
        run: gradle :sample:compileKotlinDesktop :easyniddle:desktopTest

  multiplatform-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.0"
      - name: Compile Android, Desktop, and WasmJs
        run: >-
          gradle
          :easyniddle:compileAndroidMain
          :easyniddle:compileKotlinDesktop
          :easyniddle:compileKotlinWasmJs
      - name: Verify minified Android consumer with R8
        run: gradle :r8-smoke:assembleRelease

  ios-compile:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.0"
      - name: Compile iOS device and simulator targets
        run: >-
          gradle
          :easyniddle:compileKotlinIosArm64
          :easyniddle:compileKotlinIosSimulatorArm64
          :easyniddle:compileKotlinIosX64
