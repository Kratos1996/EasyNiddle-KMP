name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  abi-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.0"
      - name: Generate initial ABI reference dump
        run: gradle :easyniddle:updateKotlinAbi
      - uses: actions/upload-artifact@v4
        with:
          name: easyniddle-abi-baseline
          path: api/
          if-no-files-found: error

  desktop-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.0"
      - name: Compile sample app and run common tests
        run: gradle :sample:compileKotlinDesktop :easyniddle:desktopTest

  multiplatform-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.0"
      - name: Compile Android, Desktop, and WasmJs
        run: >-
          gradle
          :easyniddle:compileAndroidMain
          :easyniddle:compileKotlinDesktop
          :easyniddle:compileKotlinWasmJs

  ios-compile:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.0"
      - name: Compile iOS device and simulator targets
        run: >-
          gradle
          :easyniddle:compileKotlinIosArm64
          :easyniddle:compileKotlinIosSimulatorArm64
          :easyniddle:compileKotlinIosX64
